<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brusk IT</title>
  <meta name="description" content="Brusk IT — بەم زووانە">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --ink: #f5f5f4;
      --muted: #8a8a8e;
      --bolt: #f8c702;
    }

    * { box-sizing: border-box; margin: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px 16px;
      background:
        radial-gradient(60rem 40rem at 50% 42%, rgba(248, 199, 2, 0.07), transparent 60%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Kufi Arabic", system-ui, sans-serif;
      overflow: hidden;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(2rem, 6vw, 3.5rem);
      text-align: center;
    }

    .logo {
      width: min(560px, 82vw);
      height: auto;
      direction: ltr;
      animation: rise 900ms cubic-bezier(.2, .7, .2, 1) both;
    }

    .logo .letters { fill: var(--ink); }

    .logo .bolt {
      fill: var(--bolt);
      filter: drop-shadow(0 0 18px rgba(248, 199, 2, 0.45));
      animation: flash 5s ease-in-out 1.2s infinite;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 3.75rem);
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: 0;
      animation: rise 900ms cubic-bezier(.2, .7, .2, 1) 200ms both;
    }

    .rule {
      width: 64px;
      height: 3px;
      border-radius: 3px;
      background: var(--bolt);
      animation: grow 900ms cubic-bezier(.2, .7, .2, 1) 400ms both;
    }

    footer {
      position: fixed;
      bottom: 20px;
      inset-inline: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      direction: ltr;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    @keyframes grow {
      from { opacity: 0; transform: scaleX(0); }
      to   { opacity: 1; transform: scaleX(1); }
    }

    /* Brief lightning flicker, then rest */
    @keyframes flash {
      0%, 86%, 100% { opacity: 1; filter: drop-shadow(0 0 18px rgba(248, 199, 2, 0.45)); }
      88% { opacity: 0.35; }
      90% { opacity: 1; filter: drop-shadow(0 0 34px rgba(248, 199, 2, 0.9)); }
      92% { opacity: 0.5; }
      94% { opacity: 1; filter: drop-shadow(0 0 26px rgba(248, 199, 2, 0.7)); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
